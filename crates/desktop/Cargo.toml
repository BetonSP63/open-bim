[package]
name = "open-bim-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
open-bim-model.workspace = true
eframe.workspace = true
open-bim-renderer.workspace = true
open-bim-persistence.workspace = true
egui-wgpu = { version = "=0.36.2", default-features = false }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
open-bim-commands.workspace = true
open-bim-connections.workspace = true
serde.workspace = true
serde_json.workspace = true

open-bim-steel.workspace = true
open-bim-numbering.workspace = true
open-bim-coordination.workspace = true
open-bim-drawings.workspace = true
open-bim-drawing-export.workspace = true
open-bim-reports.workspace = true
open-bim-ifc.workspace = true
# Native file picker for model import (MIT).
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }

[dev-dependencies]
skrifa = "=0.44.0"
epaint_default_fonts = "=0.36.2"
