name: CI
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    name: macOS ARM64
    runs-on: macos-15
    env:
      # Keep debug assertions while reducing symbol storage and linker work.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - name: Require ARM64 runner
        run: test "$(uname -m)" = arm64
      - name: Install pinned toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - name: Verify macOS launcher preserves projects
        run: python3 scripts/test-macos-launcher.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    env:
      # Keeps the debug build within the runner's disk and memory.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked --no-fail-fast
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build and verify Linux packages
        env:
          OPEN_BIM_LINUX_PACKAGE_OUTPUT: ${{ github.workspace }}/dist
        run: scripts/test-linux-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: open-bim-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.sha256
          retention-days: 14

      - name: Install Linux viewport test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth mesa-vulkan-drivers vulkan-tools
          python3 -m venv "$RUNNER_TEMP/open-bim-verify"
          "$RUNNER_TEMP/open-bim-verify/bin/pip" install ifcopenshell==0.8.4 pypdf==5.1.0
      - name: Run the packaged Linux modeling workflow
        run: |
          tar -xzf dist/Open-BIM-*-linux-x86_64.tar.gz -C "$RUNNER_TEMP"
          PATH="$RUNNER_TEMP/open-bim-verify/bin:$PATH" scripts/verify-linux-workflow.sh \
            "$RUNNER_TEMP"/Open-BIM-*-linux-x86_64/open-bim-desktop \
            "$RUNNER_TEMP/open-bim-linux-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: open-bim-linux-verification
          path: ${{ runner.temp }}/open-bim-linux-evidence
          if-no-files-found: ignore
          retention-days: 14

  windows:
    name: Windows x86_64
    runs-on: windows-2025
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked --no-fail-fast
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Verify Windows packaging
        run: pwsh -File scripts/test-windows-package.ps1
      - name: Build Windows package
        run: pwsh -File scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: open-bim-windows-x86_64
          path: |
            dist/*.zip
            dist/*.sha256
          retention-days: 14
