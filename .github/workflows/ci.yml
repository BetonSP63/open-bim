name: CI
on: [push, pull_request]
jobs:
  verify:
    name: macOS ARM64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Require ARM64 runner
        run: test "$(uname -m)" = arm64
      - name: Install pinned toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    env:
      # Keeps the debug build within the runner's disk and memory.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked --no-fail-fast
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
