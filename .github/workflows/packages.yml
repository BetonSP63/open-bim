name: Native application packages
on:
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libvulkan-dev desktop-file-utils
      - name: Package macOS application
        if: runner.os == 'macOS'
        run: scripts/package-macos.sh
      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Package Linux application
        if: runner.os == 'Linux'
        run: |
          desktop-file-validate assets/linux/org.openbim.OpenBIM.desktop
          scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Open-BIM-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
