[workspace]
members = ["crates/geometry", "crates/model", "crates/commands", "crates/persistence", "crates/renderer", "crates/desktop", "crates/steel", "crates/connections", "crates/numbering", "crates/coordination", "crates/drawings", "crates/drawing_export", "crates/reports", "crates/ifc", "crates/nc", "crates/api", "crates/analysis"]
exclude = ["vendor/truck-shapeops"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
open-bim-geometry = { path = "crates/geometry" }
open-bim-model = { path = "crates/model" }
open-bim-commands = { path = "crates/commands" }
open-bim-persistence = { path = "crates/persistence" }
open-bim-renderer = { path = "crates/renderer" }
open-bim-steel = { path = "crates/steel" }
open-bim-connections = { path = "crates/connections" }
open-bim-numbering = { path = "crates/numbering" }
open-bim-coordination = { path = "crates/coordination" }
open-bim-drawings = { path = "crates/drawings" }
open-bim-drawing-export = { path = "crates/drawing_export" }
open-bim-reports = { path = "crates/reports" }
open-bim-ifc = { path = "crates/ifc" }
open-bim-nc = { path = "crates/nc" }
open-bim-api = { path = "crates/api" }
open-bim-analysis = { path = "crates/analysis" }
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Geometry, CSG and report generation are too slow unoptimised for
# interactive tests; keep debug info but optimise.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

[patch.crates-io]
truck-shapeops = { path = "vendor/truck-shapeops" }
